title: '[Замечание] '
body:
  - type: textarea
    id: feedback
    attributes:
      label: Замечание или впечатление
      description: Что удобно, непонятно или мешает? Укажите версию мода и ситуацию в бою.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Пример или снимок
      description: Для неверного расчёта или сбоя удобнее заполнить форму ошибки в Issues и приложить журнал боя.
